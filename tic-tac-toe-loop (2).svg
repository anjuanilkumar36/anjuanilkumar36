<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" width="300" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="300" height="300" fill="#0d1117"/>

  <!-- grid -->
  <line x1="100" y1="10" x2="100" y2="290" stroke="#30363d" stroke-width="4"/>
  <line x1="200" y1="10" x2="200" y2="290" stroke="#30363d" stroke-width="4"/>
  <line x1="10" y1="100" x2="290" y2="100" stroke="#30363d" stroke-width="4"/>
  <line x1="10" y1="200" x2="290" y2="200" stroke="#30363d" stroke-width="4"/>

  <!-- ===== GAME 1: X wins diagonal (0,4,8) ===== -->
  <text x="50" y="70" font-size="60" font-weight="bold" fill="#58a6ff" text-anchor="middle" opacity="0">X
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0278;0.0289;0.3333;1" dur="18s" repeatCount="indefinite"/>
  </text>
  <text x="150" y="70" font-size="60" font-weight="bold" fill="#f78166" text-anchor="middle" opacity="0">O
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0833;0.0844;0.3333;1" dur="18s" repeatCount="indefinite"/>
  </text>
  <text x="150" y="170" font-size="60" font-weight="bold" fill="#58a6ff" text-anchor="middle" opacity="0">X
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1389;0.14;0.3333;1" dur="18s" repeatCount="indefinite"/>
  </text>
  <text x="250" y="70" font-size="60" font-weight="bold" fill="#f78166" text-anchor="middle" opacity="0">O
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1944;0.1955;0.3333;1" dur="18s" repeatCount="indefinite"/>
  </text>
  <text x="250" y="270" font-size="60" font-weight="bold" fill="#58a6ff" text-anchor="middle" opacity="0">X
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.2511;0.3333;1" dur="18s" repeatCount="indefinite"/>
  </text>
  <line x1="50" y1="50" x2="250" y2="250" stroke="#3fb950" stroke-width="6" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2611;0.2622;0.3333;1" dur="18s" repeatCount="indefinite"/>
  </line>
  <text x="150" y="298" font-size="14" fill="#3fb950" text-anchor="middle" opacity="0" font-family="monospace">X Wins! (Diagonal)
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2667;0.2678;0.3333;1" dur="18s" repeatCount="indefinite"/>
  </text>

  <!-- ===== GAME 2: O wins top row (0,1,2) ===== -->
  <text x="50" y="70" font-size="60" font-weight="bold" fill="#f78166" text-anchor="middle" opacity="0">O
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3611;0.3622;0.6667;1" dur="18s" repeatCount="indefinite"/>
  </text>
  <text x="50" y="170" font-size="60" font-weight="bold" fill="#58a6ff" text-anchor="middle" opacity="0">X
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4167;0.4178;0.6667;1" dur="18s" repeatCount="indefinite"/>
  </text>
  <text x="150" y="70" font-size="60" font-weight="bold" fill="#f78166" text-anchor="middle" opacity="0">O
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4722;0.4733;0.6667;1" dur="18s" repeatCount="indefinite"/>
  </text>
  <text x="150" y="170" font-size="60" font-weight="bold" fill="#58a6ff" text-anchor="middle" opacity="0">X
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5278;0.5289;0.6667;1" dur="18s" repeatCount="indefinite"/>
  </text>
  <text x="250" y="70" font-size="60" font-weight="bold" fill="#f78166" text-anchor="middle" opacity="0">O
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5833;0.5844;0.6667;1" dur="18s" repeatCount="indefinite"/>
  </text>
  <line x1="20" y1="50" x2="280" y2="50" stroke="#3fb950" stroke-width="6" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5944;0.5955;0.6667;1" dur="18s" repeatCount="indefinite"/>
  </line>
  <text x="150" y="298" font-size="14" fill="#3fb950" text-anchor="middle" opacity="0" font-family="monospace">O Wins! (Top Row)
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6;0.6011;0.6667;1" dur="18s" repeatCount="indefinite"/>
  </text>

  <!-- ===== GAME 3: X wins right column (2,5,8) ===== -->
  <text x="250" y="70" font-size="60" font-weight="bold" fill="#58a6ff" text-anchor="middle" opacity="0">X
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6944;0.6955;1;1" dur="18s" repeatCount="indefinite"/>
  </text>
  <text x="50" y="70" font-size="60" font-weight="bold" fill="#f78166" text-anchor="middle" opacity="0">O
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.7511;1;1" dur="18s" repeatCount="indefinite"/>
  </text>
  <text x="250" y="170" font-size="60" font-weight="bold" fill="#58a6ff" text-anchor="middle" opacity="0">X
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8056;0.8067;1;1" dur="18s" repeatCount="indefinite"/>
  </text>
  <text x="50" y="170" font-size="60" font-weight="bold" fill="#f78166" text-anchor="middle" opacity="0">O
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8611;0.8622;1;1" dur="18s" repeatCount="indefinite"/>
  </text>
  <text x="250" y="270" font-size="60" font-weight="bold" fill="#58a6ff" text-anchor="middle" opacity="0">X
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.9167;0.9178;1;1" dur="18s" repeatCount="indefinite"/>
  </text>
  <line x1="250" y1="20" x2="250" y2="280" stroke="#3fb950" stroke-width="6" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.9278;0.9289;1;1" dur="18s" repeatCount="indefinite"/>
  </line>
  <text x="150" y="298" font-size="14" fill="#3fb950" text-anchor="middle" opacity="0" font-family="monospace">X Wins! (Right Column)
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.9333;0.9344;1;1" dur="18s" repeatCount="indefinite"/>
  </text>
</svg>
