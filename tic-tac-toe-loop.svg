<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" width="300" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="300" height="300" fill="#0d1117"/>

  <!-- grid -->
  <line x1="100" y1="10" x2="100" y2="290" stroke="#30363d" stroke-width="4"/>
  <line x1="200" y1="10" x2="200" y2="290" stroke="#30363d" stroke-width="4"/>
  <line x1="10" y1="100" x2="290" y2="100" stroke="#30363d" stroke-width="4"/>
  <line x1="10" y1="200" x2="290" y2="200" stroke="#30363d" stroke-width="4"/>

  <!-- Move 1: X at (0,0) -->
  <text x="50" y="70" font-size="60" font-weight="bold" fill="#58a6ff" text-anchor="middle" opacity="0">
    X
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.083;0.084;0.98;1" dur="6s" repeatCount="indefinite"/>
  </text>

  <!-- Move 2: O at (1,0) -->
  <text x="150" y="70" font-size="60" font-weight="bold" fill="#f78166" text-anchor="middle" opacity="0">
    O
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.251;0.98;1" dur="6s" repeatCount="indefinite"/>
  </text>

  <!-- Move 3: X at (1,1) center -->
  <text x="150" y="170" font-size="60" font-weight="bold" fill="#58a6ff" text-anchor="middle" opacity="0">
    X
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.417;0.418;0.98;1" dur="6s" repeatCount="indefinite"/>
  </text>

  <!-- Move 4: O at (2,0) -->
  <text x="250" y="70" font-size="60" font-weight="bold" fill="#f78166" text-anchor="middle" opacity="0">
    O
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.583;0.584;0.98;1" dur="6s" repeatCount="indefinite"/>
  </text>

  <!-- Move 5: X at (2,2) - winning move -->
  <text x="250" y="270" font-size="60" font-weight="bold" fill="#58a6ff" text-anchor="middle" opacity="0">
    X
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.751;0.98;1" dur="6s" repeatCount="indefinite"/>
  </text>

  <!-- Winning diagonal line -->
  <line x1="50" y1="50" x2="250" y2="250" stroke="#3fb950" stroke-width="6" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.78;0.79;0.98;1" dur="6s" repeatCount="indefinite"/>
  </line>

  <!-- "X Wins!" caption -->
  <text x="150" y="298" font-size="16" fill="#3fb950" text-anchor="middle" opacity="0" font-family="monospace">
    X Wins! Replaying...
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8;0.81;0.98;1" dur="6s" repeatCount="indefinite"/>
  </text>
</svg>
